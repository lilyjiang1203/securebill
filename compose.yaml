services:

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: dmit2015-keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin12345!
    volumes:
      - ./keycloak-export:/opt/keycloak/data/import:Z

  rbac-api:
    image: localhost/securebill-rbac-api:latest
    container_name: securebill-rbac-api
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_JWKS_URI: http://host.containers.internal:8180/realms/dmit2015-realm/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://host.containers.internal:8180/realms/dmit2015-realm
    depends_on:
      - keycloak

  multitenant-api:
    image: localhost/securebill-multitenant-api:latest
    container_name: securebill-multitenant-api
    ports:
      - "8082:8080"
    environment:
      KEYCLOAK_JWKS_URI: http://host.containers.internal:8180/realms/dmit2015-realm/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://host.containers.internal:8180/realms/dmit2015-realm
    depends_on:
      - keycloak

  web:
    image: localhost/securebill-web:latest
    container_name: securebill-web
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_PROVIDER_URI: https://securebill-keycloak.calmtree-49de5411.westus2.azurecontainerapps.io/realms/dmit2015-realm/
      KEYCLOAK_TOKEN_URL: https://securebill-keycloak.calmtree-49de5411.westus2.azurecontainerapps.io/realms/dmit2015-realm/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: securebill-jwt-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      RBAC_API_URL: http://host.containers.internal:8080/restapi
      MULTITENANT_API_URL: http://host.containers.internal:8082/restapi
    depends_on:
      - rbac-api
      - multitenant-api