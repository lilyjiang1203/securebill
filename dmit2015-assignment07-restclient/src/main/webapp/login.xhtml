<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:faces="jakarta.faces"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:f="jakarta.faces.core"
        xmlns:h="jakarta.faces.html"
        xmlns:pt="jakarta.faces.passthrough"
        xmlns:cc="jakarta.faces.composite"
        xmlns:c="jakarta.tags.core"
        xmlns:fn="jakarta.tags.functions"
        xmlns:o="http://omnifaces.org/ui"
        xmlns:of="http://omnifaces.org/functions"
        xmlns:p="primefaces"
        template="/WEB-INF/faces-templates/layout.xhtml">

    <ui:param name="title" value="SecureBill | Login"/>

    <ui:param name="internalstyles" value="
        .login-wrapper {
            min-height: 68vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,.06);
        }

        .login-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }

        .login-icon i {
            font-size: 1.5rem;
            color: #2563eb;
        }

        .login-title {
            margin: 0;
            font-size: 1.8rem;
            color: #111827;
        }

        .login-subtitle {
            color: #6b7280;
            line-height: 1.6;
            margin-top: .5rem;
            margin-bottom: 1.5rem;
        }

        .login-footer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: .85rem;
            line-height: 1.5;
        }

        .login-button {
            width: 100%;
            margin-top: .5rem;
        }

        .logged-in-card {
            max-width: 600px;
            margin: 3rem auto;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,.05);
        }
    "/>

    <ui:define name="maincontent">

        <c:if test="#{not empty loginSession.username}">

            <div class="logged-in-card">

                <div class="login-icon"
                     style="margin-left: auto; margin-right: auto;">
                    <i class="pi pi-check-circle"></i>
                </div>

                <h1 class="login-title">
                    You're signed in
                </h1>

                <p class="login-subtitle">
                    Signed in as
                    <strong>#{loginSession.username}</strong>.
                </p>

                <div class="flex justify-content-center gap-2 flex-wrap">

                    <p:button
                            value="Go to Dashboard"
                            icon="pi pi-home"
                            outcome="/index.xhtml"/>

                    <p:button
                            value="View My Bills"
                            icon="pi pi-wallet"
                            outcome="/bill/multitenant/crud.xhtml"
                            severity="secondary"/>

                </div>

            </div>

        </c:if>


        <c:if test="#{empty loginSession.username}">

            <div class="login-wrapper">

                <div class="login-card">

                    <div class="login-icon">
                        <i class="pi pi-shield"></i>
                    </div>

                    <h1 class="login-title">
                        Welcome back
                    </h1>

                    <p class="login-subtitle">
                        Sign in to access your SecureBill workspace and protected billing data.
                    </p>

                    <h:form name="loginForm">

                        <p:messages id="messages" showDetail="true">
                            <p:autoUpdate/>
                        </p:messages>


                        <div class="field">

                            <label for="username"
                                   class="font-semibold block mb-2">
                                Username
                            </label>

                            <p:inputText
                                    id="username"
                                    placeholder="Enter your username"
                                    styleClass="w-full"
                                    value="#{keycloakLogin.username}"/>

                        </div>


                        <div class="field">

                            <label for="password"
                                   class="font-semibold block mb-2">
                                Password
                            </label>

                            <p:password
                                    id="password"
                                    placeholder="Enter your password"
                                    styleClass="w-full"
                                    feedback="false"
                                    toggleMask="true"
                                    value="#{keycloakLogin.password}"/>

                        </div>


                        <p:commandButton
                                value="Sign In"
                                icon="pi pi-sign-in"
                                action="#{keycloakLogin.submit()}"
                                update=":messages @form"
                                styleClass="login-button"/>

                    </h:form>


                    <div class="login-footer">
                        Authentication is handled through Keycloak.
                        Access to secured resources is enforced using JWT-based authorization.
                    </div>

                </div>

            </div>

        </c:if>

    </ui:define>

</ui:composition>
